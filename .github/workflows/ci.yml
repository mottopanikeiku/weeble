name: CI

on:
  pull_request:
    paths: ['eval/**', 'train/**', 'policies/**', 'assets/**', 'results/**', 'web/**',
            'README.md', 'pyproject.toml', 'uv.lock', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['eval/**', 'train/**', 'policies/**', 'assets/**', 'results/**', 'web/**',
            'README.md', 'pyproject.toml', 'uv.lock', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation:
    name: Evaluation and report (minimal install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --frozen --only-group eval
      - name: Python regressions without JAX
        run: uv run --no-sync python -m pytest eval -q -rs --ignore=eval/test_parity.py --ignore=eval/test_g1_getup.py
      - name: Recorded hashes and byte-identical report and atlas regeneration
        run: uv run --no-sync python -m eval.verify
      # Diagnostic mode: prints every changed field and outcome change between valid outcomes, and fails
      # on numerical failures, missing rows or exceptions. Outcomes differed across runner environments.
      - name: Re-simulate committed atlas episodes on this runner
        run: uv run --no-sync python -m eval.atlas --rerun 36 --workers 2

  parity:
    name: Python parity against the released checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --frozen --no-extra cuda
      - name: Download and verify the public .brax sidecars
        run: uv run --no-sync python -m train.fetch_checkpoints
      # eval/test_g1_getup.py stays on Modal: on a hosted runner it was shut down partway through.
      - name: Checkpoint fixture tests
        run: uv run --no-sync python -m pytest eval/test_fetch_checkpoints.py -q -rs
      - name: Parity, one process per policy
        run: |
          for policy in policies/*-s[012].json; do
            echo "::group::$policy"
            WEEBLE_PARITY_POLICIES="$policy" uv run --no-sync python -m pytest eval/test_parity.py -q -rs
            echo "::endgroup::"
          done

  web:
    name: Browser runtime build, parity replay and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
